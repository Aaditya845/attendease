<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AttendEase — Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand">Attend<span>Ease</span></div>
  <div class="nav">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="subjects.html">Subjects</a>
    <button class="btn-link" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">

  <div class="panel">
    <h2>Overall attendance</h2>
    <div class="overall-row" id="overallStats"></div>
  </div>

  <div class="panel">
    <h2>Subject-wise attendance</h2>
    <table>
      <thead>
        <tr><th>Subject</th><th>Attended</th><th>Total</th><th>%</th><th>Status</th></tr>
      </thead>
      <tbody id="subjectTableBody"></tbody>
    </table>
    <p class="empty-state" id="noSubjectsMsg" style="display:none;">
      No subjects yet. Add one from the Subjects page.
    </p>
  </div>

  <div class="panel">
    <h2>Attendance chart</h2>
    <div id="barChart"></div>
  </div>

  <div class="panel">
    <h2>Can I miss the next lecture?</h2>
    <form class="stacked" id="predictForm">
      <div>
        <label for="predictSubject">Subject</label>
        <select id="predictSubject" required></select>
      </div>
      <div>
        <label for="predictUpcoming">Number of upcoming lectures</label>
        <input type="number" id="predictUpcoming" min="1" max="30" value="3" required />
      </div>
      <button type="submit" class="primary">Calculate</button>
    </form>
    <div class="predict-result" id="predictResult"></div>
  </div>

  <div class="panel">
    <h2>Recent attendance records</h2>
    <div id="recentRecords"></div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
